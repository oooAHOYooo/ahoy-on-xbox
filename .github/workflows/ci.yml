name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    name: Source Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run validation checks
        run: python3 scripts/validate.py

  build-uwp:
    name: Build UWP (Windows & Xbox)
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Check published catalog adapters
        run: |
          dotnet build tests/CatalogContracts/CatalogContracts.csproj --configuration Release
          & tests/CatalogContracts/bin/Release/net48/CatalogContracts.exe

      - name: Restore NuGet packages
        run: nuget restore AhoyXbox/AhoyXbox.csproj

      - name: Build Debug x64
        run: msbuild AhoyXbox/AhoyXbox.csproj /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false

      - name: Build Release x64
        run: msbuild AhoyXbox/AhoyXbox.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never

      - name: Build Store Upload Package
        run: msbuild AhoyXbox/AhoyXbox.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundlePlatforms="x64" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageDir="AppPackages\\" /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true

      - name: Upload Store Packages
        uses: actions/upload-artifact@v4
        with:
          name: AHOY-TV-StoreUpload-Package
          path: |
            AhoyXbox/AppPackages/**/*.msixupload
            AhoyXbox/AppPackages/**/*.appxupload
            AhoyXbox/AppPackages/**/*.appxbundle
            AhoyXbox/AppPackages/**/*.msixbundle
          if-no-files-found: error

      - name: Upload Debug Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AhoyXbox-Debug-x64
          path: AhoyXbox/bin/x64/Debug/
          if-no-files-found: warn
